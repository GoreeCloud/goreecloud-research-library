schema_version: '0.2'
component:
  type: application
  id: goreecloud-research-library
  product_name: GoreeCloud Research Library
  repository: GoreeCloud/goreecloud-research-library
lifecycle: development
version: 0.2.0-dev
supported_platforms:
- web
- linux
api:
  versions:
  - v1-development
  endpoints:
  - name: health
    url: /healthz
    purpose: Process and local-database initialization signal; not a production-readiness verdict.
  - name: capture
    url: /api/v1/capture
    purpose: Development API for capturing one public research source URL.
  - name: sources
    url: /api/v1/sources
    purpose: Development read API for the local research source library.
  - name: projects
    url: /api/v1/projects
    purpose: Development read API for research projects, memberships, and source relationships.
platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Manager discovery, launch, and sanitized application-status integration are future work and are not claimed by the Development implementation.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
    - SECURITY.md
    - docs/security-model.md
    notes: Research context, project membership, saved searches, relationship notes, and recovery bundles can be privacy-sensitive; no accepted Privacy Shield runtime/contract integration exists yet.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
    - app/fetcher.py
    - app/recovery.py
    - SECURITY.md
    - docs/security-model.md
    notes: The application implements local ingestion and recovery safety controls, but Wardveil Security integration and acceptance remain outstanding.
  everkeep:
    result: applicable-migration-required
    version: null
    evidence:
    - app/db.py
    - app/recovery.py
    - tests/test_recovery.py
    - docs/deployment.md
    - docs/recovery-bundle.md
    notes: SQLite durability, schema migration records, portable exports, Recovery Bundle v1, and an automated clean-target schema-v2 restore drill now provide application-owned continuity evidence. Everkeep orchestration, protected backup custody/policy, operational target recovery acceptance, and broader Everkeep integration remain incomplete.
  glaze_ui:
    result: applicable-migration-required
    version: 1.1.0
    evidence:
    - app/static/app.css
    - BRANDING.md
    notes: The Development UI aligns with current Stable Glaze UI 1.1 principles, but formal contract, rendered, accessibility, and downstream acceptance evidence has not been established.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Research capability registration, relationships, events, and cross-application discovery are planned and not implemented.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
    - README.md
    - SECURITY.md
    notes: The Development application has no authentication. GoreeCloud Identity is required before multi-user or Internet-facing authenticated use.
health:
  health_endpoint: /healthz
  readiness_endpoint: null
continuity:
  backup:
    required: true
    requirements:
    - Protect the SQLite research database and any future approved artifact store as durable user data.
    - Use the application-owned Recovery Bundle v1 for verified schema-v2 Development backups where applicable rather than unsafe main-file-only copies of a live WAL database.
    - Keep research exports and recovery bundles protected according to their sensitivity.
    - Integrate Everkeep and validate operational backup evidence before production dependency.
  restore:
    required: true
    requirements:
    - Preserve the clean-target no-overwrite recovery boundary for application-owned Recovery Bundle v1 restores.
    - Retain automated clean-environment coverage for sources, snapshots, claims, projects, project memberships, saved searches, source relationships, search, and bundle verification.
    - Complete Everkeep orchestration plus target-environment restore, recovery/rollback, retention/deletion, and operational acceptance before production dependency.
  export:
    required: true
    requirements:
    - Preserve machine-readable JSON export without a proprietary hosted dependency.
    - Preserve source-level CSV plus CSL JSON and RIS citation portability.
  portability:
    required: true
    requirements:
    - Keep the core library usable with standard Python, SQLite, and documented open-source dependencies.
    - Keep Recovery Bundle v1 application-owned and documented without making a proprietary backup service mandatory for basic local recovery.
    - Do not make a third-party hosted AI, citation, or research platform mandatory for core data access.
external_dependencies:
- name: FastAPI
  purpose: HTTP application and development API framework.
  required: true
- name: HTTPX
  purpose: Bounded public HTTP(S) source retrieval.
  required: true
- name: Beautiful Soup
  purpose: HTML parsing foundation used by GoreeCloud-owned extraction logic.
  required: true
- name: pypdf
  purpose: PDF text and metadata parsing foundation.
  required: true
- name: Jinja2
  purpose: Server-rendered application UI templates.
  required: true
- name: SQLite
  purpose: Local-first durable source, snapshot, claim, project, relationship, saved-search, search, and Recovery Bundle v1 state handling.
  required: true
compatibility:
  platform_contract: '0.2'
  glaze_ui_required: 1.1.0
  requires:
  - goreecloud-platform-contract==0.2
  - glaze-ui==1.1.0
  provides:
  - goreecloud-research-library-api-v1-development
evidence:
  acceptance_tests: []
  release: []
conformance:
  status: nonconformant
  validated_at: null
  evidence:
  - README.md
  - SPECIFICATIONS.md
  - SECURITY.md
  - docs/security-model.md
  - docs/recovery-bundle.md
  - app/main.py
  - app/fetcher.py
  - app/db.py
  - app/recovery.py
  - tests/test_recovery.py
  blockers:
  - GoreeCloud Research Library remains in Development and has no approved release or production acceptance.
  - GoreeCloud Identity integration is not implemented.
  - Wardveil Security integration and acceptance are not implemented.
  - Privacy Shield integration and acceptance are not implemented.
  - Everkeep orchestration, protected backup custody/policy, target-environment recovery acceptance, and broader continuity acceptance remain incomplete even though Recovery Bundle v1 and automated clean-target recovery evidence now exist.
  - GoreeCloud Mesh integration is not implemented.
  - GoreeCloud Manager integration is not implemented.
  - Formal Glaze UI contract, rendered, accessibility, and downstream acceptance evidence remains outstanding.
  - Network egress hardening, abuse controls, and hostile-content parser acceptance remain outstanding for Internet-facing use.
